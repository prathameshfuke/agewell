<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AgeWell+ Elder Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Noto+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#9caf88",
                "background-light": "#f6f4ee", // Warmer beige as requested
                "background-dark": "#191b17",
                "sage-light": "#dce4d5",
                "emergency-red": "#E07A5F",
                "charcoal": "#333C3B"
              },
              fontFamily: {
                "display": ["Lexend", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-charcoal dark:text-gray-100 min-h-screen pb-32">
<!-- Top App Bar -->
<div class="flex items-center bg-transparent p-6 pb-2 justify-between">
<div class="flex size-14 shrink-0 items-center">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-12 border-2 border-primary" data-alt="Profile picture of an elderly woman smiling" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBvmzlEKnXz-uzbsRt6OHWZ_vBMvEBJn6uu54wW9gtSaEeYgNcHx-LMOyxGNFsxpldHItHpBLqrfi2jTadXL5pecKJtKo4XdHBjKcpjkqkD8ljWjSGTfZUl-RwDF84G1V4mEi9PEwloerXFWcJWHW_1cK7P4UcGI6zLzwrx2YHFp4ciHjyHBb0-Cc6FL9Pvu9ZpHE0toIKnvhlYGm_Z7chSDnw3sSmy7K8ZezC5DDx-sci9bjO-K26lxh-0SVeU9UYbkSK3wT5IlQ");'>
</div>
</div>
<div class="flex-1 px-4">
<p class="text-sm font-medium text-gray-500 dark:text-gray-400">Welcome back,</p>
<h2 class="text-[#141514] dark:text-white text-xl font-bold leading-tight tracking-tight">Sarah Thompson</h2>
</div>
<div class="flex items-center justify-end">
<button class="relative flex size-12 cursor-pointer items-center justify-center rounded-xl bg-white dark:bg-zinc-800 shadow-sm border border-gray-100 dark:border-zinc-700">
<span class="material-symbols-outlined text-charcoal dark:text-white">notifications</span>
<span class="absolute top-2 right-2 size-3 bg-emergency-red rounded-full border-2 border-white dark:border-zinc-800"></span>
</button>
</div>
</div>
<!-- Today's Status Hero Card -->
<div class="p-6">
<div class="relative overflow-hidden rounded-3xl bg-white dark:bg-zinc-800 shadow-xl border border-white/50">
<!-- Glassmorphic Background Element -->
<div class="absolute -top-12 -right-12 size-40 bg-primary/20 rounded-full blur-3xl"></div>
<div class="p-6 relative z-10">
<div class="flex items-center gap-3 mb-4">
<div class="bg-primary/20 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary font-bold">medication</span>
</div>
<div>
<p class="text-xs font-bold uppercase tracking-wider text-primary">Next Medication</p>
<p class="text-2xl font-black text-charcoal dark:text-white">10:00 AM</p>
</div>
</div>
<div class="bg-sage-light/30 dark:bg-primary/10 rounded-2xl p-4 border border-primary/10 mb-6">
<p class="text-lg font-medium text-charcoal dark:text-gray-200">
                        Vitamin D &amp; Heart Meds
                    </p>
<p class="text-sm text-gray-500 dark:text-gray-400">1 pill each • Take with water</p>
</div>
<button class="w-full flex items-center justify-center gap-3 h-16 rounded-2xl bg-primary text-white text-lg font-bold shadow-lg shadow-primary/30 active:scale-95 transition-transform">
<span class="material-symbols-outlined">check_circle</span>
<span>Mark as Taken</span>
</button>
</div>
</div>
</div>
<!-- Wellness Check-in -->
<div class="px-6">
<h3 class="text-charcoal dark:text-white text-xl font-bold mb-4">How are you feeling?</h3>
<div class="flex gap-3 h-32">
<!-- Good -->
<button class="flex-1 flex flex-col items-center justify-center gap-2 rounded-3xl bg-white dark:bg-zinc-800 border-b-4 border-primary shadow-md active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-4xl text-primary">sentiment_satisfied</span>
<span class="font-bold text-sm">Good</span>
</button>
<!-- Okay -->
<button class="flex-1 flex flex-col items-center justify-center gap-2 rounded-3xl bg-white dark:bg-zinc-800 border-b-4 border-gray-200 shadow-md active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-4xl text-gray-400">sentiment_neutral</span>
<span class="font-bold text-sm">Okay</span>
</button>
<!-- Not Well -->
<button class="flex-1 flex flex-col items-center justify-center gap-2 rounded-3xl bg-white dark:bg-zinc-800 border-b-4 border-emergency-red/50 shadow-md active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-4xl text-emergency-red">sentiment_very_dissatisfied</span>
<span class="font-bold text-sm text-emergency-red">Not Well</span>
</button>
</div>
</div>
<!-- Collapsible Vitals Section -->
<div class="p-6">
<div class="bg-white dark:bg-zinc-800 rounded-3xl shadow-sm border border-gray-100 dark:border-zinc-700">
<button class="w-full flex items-center justify-between p-5">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">favorite</span>
<span class="text-lg font-bold">Your Vitals</span>
</div>
<span class="material-symbols-outlined text-gray-400">expand_more</span>
</button>
<div class="px-5 pb-5 grid grid-cols-2 gap-4">
<div class="bg-background-light dark:bg-zinc-900/50 p-4 rounded-2xl flex flex-col items-center">
<span class="text-xs font-bold text-gray-400 uppercase">Heart Rate</span>
<p class="text-2xl font-bold text-charcoal dark:text-white">72 <span class="text-xs font-normal">bpm</span></p>
</div>
<div class="bg-background-light dark:bg-zinc-900/50 p-4 rounded-2xl flex flex-col items-center">
<span class="text-xs font-bold text-gray-400 uppercase">Blood Pressure</span>
<p class="text-2xl font-bold text-charcoal dark:text-white">120/80</p>
</div>
</div>
</div>
</div>
<!-- Navigation Bar (Large Targets) -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-xl border-t border-gray-100 dark:border-zinc-800 px-2 pt-3 pb-8 z-50">
<div class="flex justify-around items-end max-w-lg mx-auto">
<button class="flex flex-col items-center gap-1 flex-1 text-primary">
<span class="material-symbols-outlined text-3xl font-variation-fill">home</span>
<span class="text-[10px] font-bold">Home</span>
</button>
<button class="flex flex-col items-center gap-1 flex-1 text-gray-400">
<span class="material-symbols-outlined text-3xl">pill</span>
<span class="text-[10px] font-bold">Meds</span>
</button>
<!-- I'M OK Center Button -->
<div class="flex-1 flex justify-center -translate-y-4">
<button class="size-20 bg-primary rounded-full shadow-lg shadow-primary/40 flex flex-col items-center justify-center text-white border-4 border-white dark:border-zinc-900 active:scale-90 transition-transform">
<span class="text-xs font-black leading-none mb-1 uppercase tracking-tighter">I'm</span>
<span class="text-xl font-black leading-none">OK</span>
</button>
</div>
<button class="flex flex-col items-center gap-1 flex-1 text-gray-400">
<span class="material-symbols-outlined text-3xl">monitoring</span>
<span class="text-[10px] font-bold">Health</span>
</button>
<button class="flex flex-col items-center gap-1 flex-1 text-emergency-red">
<span class="material-symbols-outlined text-3xl font-variation-fill">emergency</span>
<span class="text-[10px] font-bold">SOS</span>
</button>
</div>
</nav>
</body></html>
