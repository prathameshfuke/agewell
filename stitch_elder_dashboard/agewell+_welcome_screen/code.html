<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=Noto+Serif:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#9caf88",
              "background-light": "#f6f4ee",
              "background-dark": "#191b17",
              "charcoal": "#333C3B",
              "muted-grey": "#707B7A"
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"],
              "serif": ["Noto Serif", "serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(156, 175, 136, 0.2);
        }
        .dark .glass-card {
            background: rgba(40, 43, 37, 0.6);
            border: 1px solid rgba(156, 175, 136, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display transition-colors duration-300">
<!-- Top Navigation Area -->
<header class="flex items-center justify-between p-6">
<div class="w-10"></div> <!-- Spacer for symmetry -->
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white text-lg">spa</span>
</div>
<span class="text-charcoal dark:text-white font-bold text-lg tracking-tight">AgeWell+</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20">
<span class="material-symbols-outlined text-primary text-xl">help</span>
</button>
</header>
<!-- Hero Content -->
<main class="flex-1 flex flex-col px-6 pt-4 pb-12 max-w-md mx-auto w-full">
<div class="text-center mb-10">
<h1 class="font-serif text-[36px] text-charcoal dark:text-white font-bold leading-tight mb-3">
                Welcome to AgeWell+
            </h1>
<p class="text-muted-grey dark:text-gray-400 text-lg font-normal leading-relaxed px-4">
                Select how you will use the app to get started.
            </p>
</div>
<!-- Selection Cards -->
<div class="grid grid-cols-1 gap-6 flex-1">
<!-- Elder Option -->
<button class="glass-card rounded-xl p-8 flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md transition-all border-2 border-transparent active:border-primary group">
<div class="w-20 h-20 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center justify-center mb-6 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'wght' 300">elderly</span>
</div>
<h2 class="text-charcoal dark:text-white text-2xl font-bold mb-2">I am an Elder</h2>
<p class="text-muted-grey dark:text-gray-400 text-sm">Personal health and daily support</p>
</button>
<!-- Caregiver Option -->
<button class="glass-card rounded-xl p-8 flex flex-col items-center justify-center text-center shadow-sm hover:shadow-md transition-all border-2 border-transparent active:border-primary group">
<div class="w-20 h-20 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center justify-center mb-6 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'wght' 300">volunteer_activism</span>
</div>
<h2 class="text-charcoal dark:text-white text-2xl font-bold mb-2">I am a Caregiver</h2>
<p class="text-muted-grey dark:text-gray-400 text-sm">Managing care and staying connected</p>
</button>
</div>
<!-- Visual Decorative Image Grid -->
<div class="grid grid-cols-2 gap-3 mt-10">
<div class="h-24 rounded-lg bg-cover bg-center opacity-80" data-alt="Warm sunlight through a window with a small plant" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD7xX2k1O4FHmKmhNoKfzY3l3JhEvR3SOJirD5GwpL-Drw-2o3ui-QXpXvbsa9SE8WUccTW2p7eBZm3GiuBrEm2Wm7v4OyL4ot8vwX6NTMCrgMbppNeVgKtSI4O5Ox-msjSNeCMWgkv78Gm5fUoaajvU7DQ64SYi9POdpVJJ_oGCl0qeJ1aAhBMCX4yrC-9E8KMlOApuZhKnwPKl1ZGzIJ_kqbWfOVglQvyBqeOxRlflx5FGThk8rJteVh3J5z19OfkA2EHt3E0FA');"></div>
<div class="h-24 rounded-lg bg-cover bg-center opacity-80" data-alt="Two hands holding each other gently" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCcUBXRXIaFG-ShNCQAjectFw2RdM5_ZL9JVsWftYpnK0oWPb8VXVEQV_wb_utbeSTXiqS2FoHvTrxJf1mBLx5TUGlOQw1Z4GUPvZokA27einuMor8gBBKQuC-HUIapniPadrEPGUdPU27u_jxbDIBekThh8D4eGznZ_GVMMWqLkXWzVcxb_m0gAqUiUm4lOi-0DBFkhft5MHUIEsdVIN8SRQrypvpgU9MsEAAYmjQThLMsPk2w_o1r_bnnnt8O_vOVw8CaaYZpxQ');"></div>
</div>
<!-- Footer/Meta -->
<footer class="mt-12 text-center">
<div class="flex justify-center items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-sm">lock</span>
<p class="text-muted-grey dark:text-gray-400 text-xs font-medium tracking-wide">
                    SECURE &amp; ENCRYPTED DATA
                </p>
</div>
<p class="text-muted-grey dark:text-gray-500 text-sm leading-relaxed px-8">
                Your privacy is our priority. Your data is encrypted and secure with 256-bit protection.
            </p>
<div class="mt-6 flex justify-center gap-6 text-xs font-semibold text-primary/80 uppercase tracking-widest">
<a href="#">Terms</a>
<a href="#">Privacy</a>
</div>
</footer>
</main>
<!-- Bottom Safe Area (iOS) -->
<div class="h-8 w-full"></div>
</body></html>
